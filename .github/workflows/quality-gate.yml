name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks
    # The reusable gate requires Python >= 3.9 with PyYAML.  ci-bw20 is the
    # validated quality-capable runner in the shared HCU pool.
    uses: HYGON-AI/quality-gate/.github/workflows/pr-quality-gate.yml@v2.0.1
    with:
      runner_labels: '["self-hosted","Linux","X64","ci","bw20","bw1000"]'
    permissions:
      contents: read
