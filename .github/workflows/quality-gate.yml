name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks
    # v2.0.1 explicitly declares runner_labels; route the checks to the same
    # general self-hosted runner pool used by the HCU workflows.
    uses: HYGON-AI/quality-gate/.github/workflows/pr-quality-gate.yml@v2.0.1
    with:
      runner_labels: '["self-hosted","Linux","X64","ci"]'
    permissions:
      contents: read
