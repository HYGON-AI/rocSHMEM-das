name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: hygon-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Checks
    uses: HYGON-AI/quality-gate/.github/workflows/pr-quality-gate.yml@v2.0.3
    with:
      # Match Mooncake's general HCU runner pool. Without this override the
      # reusable workflow requests the isolated `quality` label and can wait
      # forever when no quality-labelled runner is online.
      runner_labels: '["self-hosted","Linux","X64","ci"]'
    permissions:
      contents: read
