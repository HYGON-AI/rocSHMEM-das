name: rocSHMEM RUN

on:
  # Package code only after it enters develop, including merged fork PRs.
  push:
    branches: [develop]

permissions:
  contents: read

# Do not cancel an earlier merged PR's package when another PR is merged.
concurrency:
  group: rocshmem-run-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    name: Package merged commit (dtk${{ matrix.dtk.version }}, py${{ matrix.dtk.python }})
    runs-on: [self-hosted, Linux, X64, ci, nmz1, bw1100]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Both DTK builds publish on nmz1 and share its cross-node CI lock.
      max-parallel: 1
      matrix:
        # One entry per supported DTK; each pairs a version with the Python
        # version baked into its image. Versions, Python and the image name
        # all come from repository variables, so moving to a new image never
        # needs an edit here.
        dtk:
          - version: ${{ vars.DTK_VERSION }}
            python: ${{ vars.PYTHON_VERSION }}
          - version: ${{ vars.DTK_OLD_VERSION }}
            python: ${{ vars.PYTHON_OLD_VERSION }}
    env:
      HARBOR_SITE: ${{ vars.HARBOR_SITE }}
      DTK_VERSION: ${{ matrix.dtk.version }}
      DTK_PYTHON_VERSION: ${{ matrix.dtk.python }}
      # Image name portion of the DTK tag (for example, rockylinux8.6); change
      # this repository variable to switch to another Rocky Linux 8.6 image.
      # Packages are built on Rocky Linux 8.6: binaries built on Ubuntu 22.04
      # link against newer glibc/libstdc++ and do not run on Rocky 8.6, while
      # Rocky 8.6 builds run on both images.
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      PIP_INDEX_URL: https://mirrors.ustc.edu.cn/pypi/simple
      SHCA_TOOLS_RPM_BASE_URL: ${{ vars.SHCA_TOOLS_RPM_BASE_URL }}
      ROCSHMEM_CI_ROCKY_REPO: https://mirrors.ustc.edu.cn/rocky/8
      ROCSHMEM_PACKAGE_SHA: ${{ github.sha }}
      ROCSHMEM_PACKAGE_HOST_DIR: /ci/github_ci_packages/rocshmem
    steps:
      - name: Checkout the exact merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure DTK environment and package paths
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${HARBOR_SITE:?missing HARBOR_SITE}"
          : "${DTK_PYTHON_VERSION:?missing repository variable PYTHON_VERSION / PYTHON_OLD_VERSION}"
          : "${IMAGE_NAME:?missing repository variable IMAGE_NAME}"
          if [[ ! "$DTK_VERSION" =~ ^[0-9]{4}$ ]]; then
            echo '::error::Selected DTK version must contain four digits (for example, 2610).'
            exit 1
          fi
          if [[ ! "$DTK_PYTHON_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Repository variable PYTHON_VERSION / PYTHON_OLD_VERSION must look like 3.12 (got '${DTK_PYTHON_VERSION}')."
            exit 1
          fi
          if [[ ! "$IMAGE_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Repository variable IMAGE_NAME must be a bare image name such as rockylinux8.6 (got '${IMAGE_NAME}')."
            exit 1
          fi
          {
            echo "ROCSHMEM_CI_IMAGE=${HARBOR_SITE%/}/hcu/base/dtk:${DTK_VERSION:0:2}.${DTK_VERSION:2:2}-${IMAGE_NAME}-py${DTK_PYTHON_VERSION}"
            echo "ROCSHMEM_PACKAGE_ROOT=$RUNNER_TEMP/rocshmem-run/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-dtk$DTK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Build and validate RUN in a fresh container
        shell: bash
        env:
          ROCSHMEM_PACKAGE_DTK_VERSION: ${{ matrix.dtk.version }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/upload_package.sh

      - name: Save RUN and provenance (host publishing happens in the build step)
        uses: actions/upload-artifact@v4
        with:
          name: rocshmem-run-dtk${{ matrix.dtk.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROCSHMEM_PACKAGE_ROOT }}/packages/
          if-no-files-found: error
          retention-days: 30

      - name: Save packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocshmem-run-logs-dtk${{ matrix.dtk.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROCSHMEM_PACKAGE_ROOT }}/logs/
          if-no-files-found: warn
          retention-days: 14
