name: rocSHMEM RUN

on:
  # Package code only after it enters develop, including merged fork PRs.
  push:
    branches: [develop]

permissions:
  contents: read

# Do not cancel an earlier merged PR's package when another PR is merged.
concurrency:
  group: rocshmem-run-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    name: Package merged commit (dtk${{ matrix.dtk.version }}, py${{ matrix.dtk.python }}, ${{ matrix.variant }})
    runs-on: [self-hosted, Linux, X64, ci, nmz1, bw1100]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Both variants publish on nmz1 and share its cross-node CI lock.
      max-parallel: 1
      matrix:
        variant: [mlx5, shca]
        # One entry per supported DTK; each pairs a version with the Python
        # version baked into its image. Both come from repository variables,
        # so moving to a new image never needs an edit here.
        dtk:
          - version: ${{ vars.DTK_VERSION }}
            python: ${{ vars.PYTHON_VERSION }}
          - version: ${{ vars.DTK_OLD_VERSION }}
            python: ${{ vars.PYTHON_OLD_VERSION }}
    env:
      HARBOR_SITE: ${{ vars.HARBOR_SITE }}
      DEVPI_URL: ${{ vars.DEVPI_URL }}
      DTK_VERSION: ${{ matrix.dtk.version }}
      DTK_PYTHON_VERSION: ${{ matrix.dtk.python }}
      ROCSHMEM_PACKAGE_VARIANT: ${{ matrix.variant }}
      RESOURCE_SERVER_URL: http://10.16.1.201:8000
      PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
      ROCSHMEM_PACKAGE_SHA: ${{ github.sha }}
      ROCSHMEM_PACKAGE_HOST_DIR: /ci/github_ci_packages/rocshmem
    steps:
      - name: Checkout the exact merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure DTK environment and package paths
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${HARBOR_SITE:?missing HARBOR_SITE}" "${DEVPI_URL:?missing DEVPI_URL}" "${PIP_TRUSTED_HOST:?missing PIP_TRUSTED_HOST}"
          : "${DTK_PYTHON_VERSION:?missing repository variable PYTHON_VERSION / PYTHON_OLD_VERSION}"
          if [[ ! "$DTK_VERSION" =~ ^[0-9]{4}$ ]]; then
            echo '::error::Selected DTK version must contain four digits (for example, 2610).'
            exit 1
          fi
          if [[ ! "$DTK_PYTHON_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Repository variable PYTHON_VERSION / PYTHON_OLD_VERSION must look like 3.12 (got '${DTK_PYTHON_VERSION}')."
            exit 1
          fi
          {
            echo "ROCSHMEM_CI_IMAGE=${HARBOR_SITE%/}/hcu/base/dtk:${DTK_VERSION:0:2}.${DTK_VERSION:2:2}-ubuntu22.04-py${DTK_PYTHON_VERSION}"
            echo "PIP_INDEX_URL=${DEVPI_URL%/}/nightly/dtk${DTK_VERSION}/+simple/"
            echo "ROCSHMEM_PACKAGE_ROOT=$RUNNER_TEMP/rocshmem-run/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-dtk$DTK_VERSION-$ROCSHMEM_PACKAGE_VARIANT"
          } >> "$GITHUB_ENV"

      - name: Build and validate RUN in a fresh container
        shell: bash
        env:
          ROCSHMEM_PACKAGE_DTK_VERSION: ${{ matrix.dtk.version }}
        run: |
          set -Eeuo pipefail
          bash scripts/ci/upload_package.sh

      - name: Save RUN and provenance (host publishing happens in the build step)
        uses: actions/upload-artifact@v4
        with:
          name: rocshmem-run-dtk${{ matrix.dtk.version }}-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROCSHMEM_PACKAGE_ROOT }}/packages/
          if-no-files-found: error
          retention-days: 30

      - name: Save packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocshmem-run-logs-dtk${{ matrix.dtk.version }}-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROCSHMEM_PACKAGE_ROOT }}/logs/
          if-no-files-found: warn
          retention-days: 14
