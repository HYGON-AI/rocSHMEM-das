name: rocSHMEM DEB

on:
  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  contents: read

# Do not cancel an earlier merged PR's package when another PR is merged.
concurrency:
  group: rocshmem-deb-${{ github.event.pull_request.number }}-${{ github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: false

jobs:
  package:
    name: Package merged commit (${{ matrix.variant }})
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, Linux, X64, ci, nmz1, bw1100]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Both variants publish on nmz1 and share its cross-node CI lock.
      max-parallel: 1
      matrix:
        variant: [mlx5, shca]
    env:
      ROCSHMEM_CI_IMAGE: ${{ vars.BASE_COMPILE_IMAGE_UBUNTU_PY310 }}
      ROCSHMEM_PACKAGE_VARIANT: ${{ matrix.variant }}
      RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL || 'http://10.16.1.201:8000' }}
      ROCSHMEM_PACKAGE_DTK_URL: ${{ format('{0}/dtk-pkg/dtk26.04/DTK-26.04-rc4-ubuntu20.04-x86_64.tar.gz', vars.RESOURCE_SERVER_URL || 'http://10.16.1.201:8000') }}
      PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
      PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
      ROCSHMEM_PACKAGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      ROCSHMEM_PACKAGE_PR: ${{ github.event.pull_request.number }}
      ROCSHMEM_PACKAGE_HOST_DIR: /ci/github_ci_packages/rocshmem
    steps:
      - name: Checkout the exact merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize package paths
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$ROCSHMEM_CI_IMAGE" ]]; then
            echo '::error::Set BASE_COMPILE_IMAGE_UBUNTU_PY310 to the validated Mooncake Ubuntu image.'
            exit 1
          fi
          printf 'ROCSHMEM_PACKAGE_ROOT=%s/rocshmem-deb/%s-%s-%s\n' \
            "${RUNNER_TEMP}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${ROCSHMEM_PACKAGE_VARIANT}" >> "${GITHUB_ENV}"

      - name: Build and validate DEB in a fresh container
        shell: bash
        run: bash scripts/ci/package_hygon_deb.sh

      - name: Save DEB and provenance (not a package repository upload)
        uses: actions/upload-artifact@v4
        with:
          name: rocshmem-deb-${{ matrix.variant }}-pr${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROCSHMEM_PACKAGE_ROOT }}/packages/
          if-no-files-found: error
          retention-days: 30

      - name: Save packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocshmem-deb-logs-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROCSHMEM_PACKAGE_ROOT }}/logs/
          if-no-files-found: warn
          retention-days: 14
