name: rocSHMEM RUN

on:
  # Package code only after it enters develop, including merged fork PRs.
  push:
    branches: [develop]

permissions:
  contents: read

# Do not cancel an earlier merged PR's package when another PR is merged.
concurrency:
  group: rocshmem-run-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    name: Package merged commit (${{ matrix.variant }})
    runs-on: [self-hosted, Linux, X64, ci, nmz1, bw1100]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Both variants publish on nmz1 and share its cross-node CI lock.
      max-parallel: 1
      matrix:
        variant: [mlx5, shca]
    env:
      # IMAGE is the rocSHMEM repository variable for the validated Ubuntu build image.
      ROCSHMEM_CI_IMAGE: ${{ vars.IMAGE }}
      ROCSHMEM_PACKAGE_VARIANT: ${{ matrix.variant }}
      # The rocSHMEM repository does not define a separate resource-server variable.
      # Keep this endpoint explicit so a missing Actions variable cannot produce an
      # empty URL inside the packaging container.
      RESOURCE_SERVER_URL: http://10.16.1.201:8000
      ROCSHMEM_PACKAGE_DTK_URL: http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-ubuntu20.04-x86_64.tar.gz
      PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
      PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
      ROCSHMEM_PACKAGE_SHA: ${{ github.sha }}
      ROCSHMEM_PACKAGE_HOST_DIR: /ci/github_ci_packages/rocshmem
    steps:
      - name: Checkout the exact merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize package paths
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$ROCSHMEM_CI_IMAGE" ]]; then
            echo '::error::Set the rocSHMEM repository variable IMAGE to the validated Ubuntu build image.'
            exit 1
          fi
          printf 'ROCSHMEM_PACKAGE_ROOT=%s/rocshmem-run/%s-%s-%s\n' \
            "${RUNNER_TEMP}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${ROCSHMEM_PACKAGE_VARIANT}" >> "${GITHUB_ENV}"

      - name: Build and validate RUN in a fresh container
        shell: bash
        run: bash scripts/ci/package_hygon_run.sh

      - name: Save RUN and provenance (host publishing happens in the build step)
        uses: actions/upload-artifact@v4
        with:
          name: rocshmem-run-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROCSHMEM_PACKAGE_ROOT }}/packages/
          if-no-files-found: error
          retention-days: 30

      - name: Save packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocshmem-run-logs-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROCSHMEM_PACKAGE_ROOT }}/logs/
          if-no-files-found: warn
          retention-days: 14
